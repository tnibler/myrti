[package]
name = "myrti-data"
version = "0.1.0"
edition = "2024"

[dependencies]

chrono = { workspace = true }
camino = { workspace = true }
eyre = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.29.1", features = ["full"] }
tracing = { workspace = true }

is_sorted = "0.1.1"
diesel = { version = "2.3.11", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.1.0", features = ["sqlite"] }
deadpool-diesel = { version = "0.5.0", features = ["sqlite", "tracing", "serde"] }
deadpool = { version = "0.10.0", features = ["rt_tokio_1"] }
libsqlite3-sys = { version = "0.38.1", features = ["bundled"] }

[build-dependencies]
cc = "1.0.79"
pkg-config = "0.3.27"
bindgen = "0.72.1"

[dev-dependencies]
pretty_assertions = "1.4.0"
proptest = "1.3.1"

roxmltree = "0.21.1"
