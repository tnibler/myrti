[package]
name = "myrti"
version = "0.1.0"
edition = "2024"

[dependencies]
myrti-data = { path = "../myrti-data" }
myrti-core = { path = "../myrti-core" }

axum = { version = "0.8.9", features = ["tracing", "macros", "json", "tokio", "query", "http2"] }
axum-extra = { version = "0.12.6", features = ["async-read-body", "tracing"] }
camino = { workspace = true }
chrono = { workspace = true }
color-eyre = "0.6.2"
eyre = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { version = "0.5.3", features = ["tracing"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "util", "fs", "cors"] }
tracing = { workspace = true }
tracing-error = "0.2.0"
tracing-forest = { version = "0.1.6", features = ["ansi", "tokio", "serde", "env-filter"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
utoipa = { version = "4.2.0", features = ["axum_extras", "chrono"] }
utoipa-discover = { git = "https://github.com/tnibler/utoipa-discover", rev = "3dffbfc4c46bb30cd957ca4f997f88758a95ae28" }
clap = { version = "4.5.3", features = ["derive"] }
hyper-util = { version = "0.1.3", features = ["tokio", "server", "server-auto", "http1", ] }
tracing-appender = "0.2.5"

[build-dependencies]
cc = "1.0.79"
pkg-config = "0.3.27"
bindgen = "0.66.1"

[dev-dependencies]
myrti-core = { path = "../myrti-core", features = ["__private-test"] }

claims = "0.7.1"
http-body-util = "0.1.5"
pretty_assertions = "1.4.0"
proptest = "1.3.1"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "print-openapi"
path = "src/bin/print_openapi.rs"
